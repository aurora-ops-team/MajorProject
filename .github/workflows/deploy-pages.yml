name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [roshan]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure frontend API
        env:
          RENDER_API_URL: ${{ vars.RENDER_API_URL }}
        run: |
          test -n "$RENDER_API_URL"
          printf 'window.AURORA_API_BASE = "%s";\n' "$RENDER_API_URL" > frontend/runtime-config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
