[tool.poetry]
name = "aurora-ops-backend"
version = "0.1.0"
description = "Flask backend for the Aurora Ops satellite operations console"
authors = ["Aurora Ops Team"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
flask = "3.0.3"
flask-cors = "4.0.1"
pandas = ">=2.2,<3"
numpy = ">=1.26,<2"
scikit-learn = "1.5.1"
joblib = "1.4.2"
python-dotenv = "1.0.1"
gunicorn = "23.0.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
