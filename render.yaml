services:
  - type: web
    name: aurora-ops-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: AURORA_DEBUG
        value: "false"
      - key: AURORA_CORS_ORIGINS
        sync: false
      - key: AURORA_CHAT_PROVIDER
        value: fallback
      - key: AURORA_CHAT_API_URL
        sync: false
      - key: AURORA_CHAT_API_KEY
        sync: false
      - key: AURORA_CHAT_MODEL
        sync: false
      - key: AURORA_CHAT_TIMEOUT_SECONDS
        value: "15"
