<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Anomaly Detection Center | Aurora Ops</title>
<meta name="description" content="AI-powered real-time telemetry anomaly monitoring with time-series deviation analysis for the Aurora satellite constellation." />
<link rel="stylesheet" href="universal.css" />
<script src="vendor/chart.umd.js"></script>
<style>
  .sat-card { position: relative; overflow: hidden; padding: 1.25rem; border-radius: var(--radius-xl); }
  .sat-card .top-line { position: absolute; inset-inline: 0; top: 0; height: 1px; }
  .sat-card-head { display: flex; align-items: flex-start; justify-content: space-between; }
  .sat-card-id { display: flex; align-items: center; gap: 1rem; }
  .sat-icon-badge { display: grid; place-items: center; width: 3.5rem; height: 3.5rem; border-radius: var(--radius-xl); border: 1px solid; background: oklch(0.22 0.03 258 / 60%); }
  .sat-icon-badge svg { width: 1.5rem; height: 1.5rem; }
  .sat-card-stats { margin-top: 1.25rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; }
  .sat-card-stat { border-radius: var(--radius-lg); border: 1px solid var(--border); background: oklch(0.16 0.03 258 / 35%); padding: .75rem; }
  .sat-card-stat dt { font-size: .6rem; text-transform: uppercase; letter-spacing: .14em; color: var(--muted-foreground); }
  .sat-card-stat dd { margin: .25rem 0 0; font-family: var(--font-mono); font-size: 1.25rem; font-weight: 600; }
  .sat-card-foot { margin-top: 1.25rem; display: flex; align-items: center; justify-content: space-between; }
  .back-link { display: inline-flex; align-items: center; gap: .5rem; margin-bottom: 1rem; font-size: .75rem; text-transform: uppercase; letter-spacing: .14em; color: var(--muted-foreground); background: none; border: none; cursor: pointer; }
  .back-link:hover { color: var(--primary); }
  .back-link svg { width: .875rem; height: .875rem; }
  .detail-top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 2rem; }
  .param-tabs { display: flex; flex-wrap: wrap; gap: .375rem; padding: .75rem 1.25rem 0; }
  .param-tab { border-radius: 999px; border: 1px solid var(--border); background: none; padding: .25rem .75rem; font-size: .65rem; color: var(--muted-foreground); cursor: pointer; }
  .param-tab.active { border-color: oklch(0.78 0.145 205 / 50%); background: oklch(0.78 0.145 205 / 12%); color: var(--primary); }
  .anomaly-chart-body { height: 330px; padding: 1rem .5rem; }
  .side-anomaly { padding: .75rem 1rem; border-bottom: 1px solid oklch(0.35 0.035 255 / 30%); }
  .side-anomaly:last-child { border-bottom: none; }
  .side-anomaly .row1 { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
</style>
</head>
<body>
<script src="app.js"></script>
<script src="runtime-config.js"></script>
<script src="api.js"></script>
<script>
  const pageRoot = renderShell("Anomaly Detection Center");
  let openId = null;
  let param = "battery_voltage";
  let anomalyChart = null;
  let anomaliesSummary = null;
  let pollTimer = null;

  function stopPoll() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

  async function renderListView() {
    stopPoll();
    pageRoot.innerHTML = `
      <div class="stack">
        <div class="page-header">
          <div><h1>Anomaly Detection Center</h1><p class="subtitle">AI-powered real-time telemetry anomaly monitoring</p></div>
          <span class="badge">${ICONS.radar} Isolation Forest Anomaly Detection</span>
        </div>
        <div class="grid-2" id="satCards"></div>
      </div>
    `;
    await loadList();
    pollTimer = setInterval(loadList, 30000);
  }

  async function loadList() {
    anomaliesSummary = await api.getAnomalies();
    document.getElementById("satCards").innerHTML = anomaliesSummary.satellites.map((s) => {
      const color = statusColorVar(s.priority);
      return `
      <section class="sat-card glass glass-hover">
        <div class="top-line" style="background:linear-gradient(90deg,transparent,${color},transparent)"></div>
        <div class="sat-card-head">
          <div class="sat-card-id">
            <span class="sat-icon-badge" style="border-color:${color};color:${color}">${ICONS.satellite}</span>
            <div><p class="font-display" style="font-size:1.125rem;font-weight:600">${s.id}</p><p class="text-muted" style="font-size:.75rem">Health: ${s.health_prediction}</p></div>
          </div>
          ${statusChipHTML(s.priority)}
        </div>
        <dl class="sat-card-stats">
          <div class="sat-card-stat"><dt>Anomalies (session)</dt><dd style="color:${color}">${s.anomaly_count}</dd></div>
          <div class="sat-card-stat"><dt>Current Status</dt><dd style="font-size:.8rem">${statusChipHTML(s.anomaly_status, false)}</dd></div>
          <div class="sat-card-stat"><dt>Anomaly Score</dt><dd style="color:${color}">${s.anomaly_score.toFixed(2)}</dd></div>
        </dl>
        <div class="sat-card-foot">
          <p class="mono-num text-muted" style="font-size:.7rem">Last telemetry · ${s.last_updated ? new Date(s.last_updated).toISOString().replace("T", " ").slice(0, 19) + " UTC" : "—"}</p>
          <button type="button" class="btn btn-primary" data-open="${s.id}">View Details</button>
        </div>
      </section>`;
    }).join("");
    document.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => { openId = b.dataset.open; renderDetailView(); }));
  }

  async function renderDetailView() {
    stopPoll();
    const detail = await api.getAnomalyDetail(openId);
    const sat = detail.current;
    const paramHist = await api.getAnomalyParamHistory(openId, param, 100);
    const meta = PARAMETERS.find((p) => p.key === param);
    const rows = detail.comparison_table;
    const sideAnomalies = detail.events;

    pageRoot.innerHTML = `
      <div class="stack">
        <section class="panel glass" style="padding:1.25rem">
          <button type="button" class="back-link" id="backBtn">${ICONS.chevron} Back to constellation</button>
          <div class="detail-top-row">
            <div><p class="font-display" style="font-size:1.25rem;font-weight:600">${openId}</p><p class="text-muted" style="font-size:.75rem">Isolation Forest anomaly detection</p></div>
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:.75rem">
              ${statusChipHTML(sat.health_prediction)}${statusChipHTML(sat.priority)}
              <span class="mono-num" style="border-radius:999px;border:1px solid var(--border);background:oklch(0.16 0.03 258 / 40%);padding:.25rem .75rem;font-size:.75rem">Anomaly score <span class="text-primary">${sat.anomaly_score.toFixed(2)}</span></span>
              <span class="mono-num text-muted" style="font-size:.75rem">Updated ${sat.last_updated ? new Date(sat.last_updated).toISOString().slice(11, 19) + " UTC" : "—"}</span>
            </div>
          </div>
        </section>

        <div class="grid-2" style="grid-template-columns:1fr 320px">
          <section class="panel glass">
            <div class="panel-header">
              <div><h3>Telemetry Time-Series</h3><p class="subtitle">Cyan trend · red markers show telemetry cycles flagged Anomaly</p></div>
            </div>
            <div class="param-tabs" id="paramTabs"></div>
            <div class="anomaly-chart-body"><canvas id="anomalyChart"></canvas></div>
          </section>
          <section class="panel glass" style="height:fit-content">
            <div class="panel-header"><div><h3>Detected Anomalies</h3><p class="subtitle">${sideAnomalies.length} events this session</p></div></div>
            <div>${sideAnomalies.length ? sideAnomalies.map((a) => `
              <div class="side-anomaly">
                <div class="row1"><span class="mono-num text-primary" style="font-size:.7rem">Row ${a.row}</span>${statusChipHTML(a.priority, false)}</div>
                <p style="margin-top:.25rem;font-size:.75rem">Anomaly score ${a.anomaly_score.toFixed(2)} · health ${a.health_prediction}</p>
                <p class="mono-num" style="margin-top:.125rem;font-size:.66rem;color:var(--muted-foreground)">${new Date(a.timestamp).toISOString().replace("T", " ").slice(0, 19)} UTC</p>
              </div>`).join("") : `<div class="side-anomaly"><p style="font-size:.75rem;color:var(--muted-foreground)">No anomalies recorded yet this session.</p></div>`}
            </div>
          </section>
        </div>

        <section class="panel glass">
          <div class="panel-header"><h3>Anomaly Comparison Table</h3><p class="subtitle">Current telemetry vs the documented nominal envelope for each parameter</p></div>
          <div class="table-wrap"><table class="data-table">
            <thead><tr><th>Parameter</th><th>Current Value</th><th>Expected Range</th><th>Deviation</th><th>Status</th></tr></thead>
            <tbody>${rows.map((r) => {
              const bad = r.status !== "NORMAL";
              return `<tr style="${bad ? "background:rgba(220,60,60,0.08)" : ""}">
                <td><span style="display:flex;align-items:center;gap:.5rem">${bad ? '<span style="color:var(--critical)">⚠</span>' : '<span style="width:6px;height:6px;border-radius:999px;background:var(--nominal);display:inline-block;box-shadow:0 0 8px var(--nominal)"></span>'} ${r.parameter}</span></td>
                <td class="mono-num" style="color:${bad ? "var(--critical)" : "var(--foreground)"}">${r.current}</td>
                <td class="mono-num text-muted">${r.expected}</td>
                <td class="mono-num">${r.deviation}</td>
                <td>${statusChipHTML(r.status)}</td>
              </tr>`;
            }).join("")}</tbody>
          </table></div>
        </section>
      </div>
    `;

    document.getElementById("backBtn").addEventListener("click", () => { openId = null; renderListView(); });

    document.getElementById("paramTabs").innerHTML = PARAMETERS.map((p) =>
      `<button type="button" class="param-tab ${param === p.key ? "active" : ""}" data-param="${p.key}">${p.label}</button>`).join("");
    document.querySelectorAll("[data-param]").forEach((b) => b.addEventListener("click", () => { param = b.dataset.param; renderDetailView(); }));

    drawAnomalyChart(paramHist.history, meta);
    pollTimer = setInterval(renderDetailView, 30000);
  }

  function drawAnomalyChart(history, meta) {
    if (anomalyChart) anomalyChart.destroy();
    const values = history.map((d) => d.value);
    const labels = history.map((d) => new Date(d.timestamp).toISOString().slice(11, 19));
    const min = values.length ? Math.min(...values) : 0, max = values.length ? Math.max(...values) : 1;
    anomalyChart = chartOrFallback("anomalyChart", (canvas) => new Chart(canvas, {
      type: "line",
      data: {
        labels,
        datasets: [
          { label: meta.label, data: values, borderColor: "#67d9f0", backgroundColor: "rgba(103,217,240,0.12)", fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2.2 },
          { label: "Anomalous points", data: history.map((d) => (d.anomaly_status === "Anomaly" ? d.value : null)), borderColor: "transparent", backgroundColor: "#e0685f", pointRadius: 4, showLine: false },
        ],
      },
      options: {
        maintainAspectRatio: false, responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#8a93a8", font: { size: 10 }, maxTicksLimit: 10 } },
          y: { grid: { color: "rgba(148,163,184,0.12)" }, ticks: { color: "#8a93a8", font: { size: 10 } }, min: min - (max - min) * 0.25 - 0.5, max: max + (max - min) * 0.25 + 0.5 },
        },
      },
    }));
  }

  renderListView();
</script>
</body>
</html>
