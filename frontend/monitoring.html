<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Satellite Telemetry Monitoring | Aurora Ops</title>
<meta name="description" content="Historical and live telemetry for SAT-01 and SAT-02: battery voltage, temperature, altitude, attitude error and downlink rate." />
<link rel="stylesheet" href="universal.css" />
<script src="vendor/chart.umd.js"></script>
<style>
  .header-controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .75rem; }
  .param-chart-body { height: 180px; padding: .75rem .5rem; }
  .table-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
  tr.row-critical td { background: rgba(220,60,60,0.08); }
  .telemetry-column-label { display: inline-flex; flex-direction: column; gap: .15rem; }
  .telemetry-column-label small { font-size: .5rem; font-weight: 500; letter-spacing: .08em; color: var(--primary); }
  .telemetry-legend { margin-top: .25rem; font-size: .65rem; color: var(--muted-foreground); }
  .telemetry-legend strong { color: var(--foreground); font-weight: 600; }
  .thermal-state { display: inline-flex; align-items: center; gap: .45rem; min-width: 6.6rem; border: 1px solid; border-radius: .3rem; padding: .25rem .5rem; font-size: .62rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  .thermal-state::before { content: ""; width: .22rem; height: .85rem; border-radius: .15rem; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .thermal-nominal { border-color: oklch(0.78 0.145 205 / 45%); background: oklch(0.78 0.145 205 / 10%); color: var(--primary); }
  .thermal-degraded { border-color: oklch(0.65 0.23 24 / 45%); background: oklch(0.65 0.23 24 / 12%); color: var(--critical); }
</style>
</head>
<body>
<script src="app.js"></script>
<script src="api.js"></script>
<script>
  const pageRoot = renderShell("Satellite Telemetry Monitoring");
  let satId = "SAT-01", query = "", desc = true;
  let paramCharts = {};
  let currentHistory = [];

  pageRoot.innerHTML = `
    <div class="stack">
      <div class="page-header">
        <div><h1>Satellite Telemetry</h1><p class="subtitle">Live and historical housekeeping telemetry with abnormal-value highlighting</p></div>
        <div class="header-controls">
          <div class="glass btn-toggle-group" id="satToggle"></div>
        </div>
      </div>

      <div class="grid-6" id="metricCards"></div>

      <div class="grid-2" id="paramCharts"></div>

      <section class="panel glass">
        <div class="panel-header">
          <div>
            <h3>Telemetry Records</h3>
            <p class="subtitle" id="recordsSubtitle"></p>
            <p class="telemetry-legend"><strong>Thermal Status</strong> = subsystem input · <strong>Health</strong> = overall model priority</p>
          </div>
          <div class="table-toolbar">
            <div class="field search-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="text" id="searchInput" class="input" placeholder="Search timestamp or status" />
            </div>
            <button type="button" id="sortBtn" class="btn">Sort Newest</button>
            <button type="button" id="exportCsvBtn" class="btn btn-primary">Export CSV</button>
          </div>
        </div>
        <div class="table-wrap" style="max-height:440px;overflow:auto">
          <table class="data-table" style="min-width:980px">
            <thead><tr>
              <th>Timestamp</th><th>Satellite</th><th>Battery V</th><th>Temp °C</th><th>Altitude km</th><th>Attitude °</th><th>Rate Mbps</th>
              <th title="Thermal control subsystem state"> <span class="telemetry-column-label">Thermal Status<small>SUBSYSTEM INPUT</small></span></th>
              <th title="Overall health and priority from the prediction pipeline"> <span class="telemetry-column-label">Health<small>OVERALL PREDICTION</small></span></th>
            </tr></thead>
            <tbody id="recordsBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  `;

  function renderToggles() {
    document.getElementById("satToggle").innerHTML = SATELLITE_IDS.map((id) =>
      `<button type="button" class="btn-toggle ${satId === id ? "active" : ""}" data-sat="${id}">${id}</button>`).join("");
    document.querySelectorAll("[data-sat]").forEach((b) => b.addEventListener("click", () => { satId = b.dataset.sat; refresh(); }));
  }

  function thermalStatusHTML(status) {
    const normalized = String(status).toUpperCase();
    const cls = normalized === "DEGRADED" ? "thermal-degraded" : "thermal-nominal";
    return `<span class="thermal-state ${cls}">${normalized}</span>`;
  }

  function renderMetricCards(telemetryAnnotated) {
    const t = telemetryAnnotated;
    const cards = [
      { label: "Battery Voltage", value: `${t.battery_voltage.value.toFixed(2)} V`, ok: t.battery_voltage.status === "NORMAL" },
      { label: "Panel Temperature", value: `${t.solar_panel_temperature.value.toFixed(1)} °C`, ok: t.solar_panel_temperature.status === "NORMAL" },
      { label: "Orbital Altitude", value: `${t.orbital_altitude.value.toFixed(1)} km`, ok: true },
      { label: "Attitude Error", value: `${t.attitude_control_error.value.toFixed(2)}°`, ok: t.attitude_control_error.status === "NORMAL" },
      { label: "Transmission Rate", value: `${t.data_transmission_rate.value.toFixed(1)} Mbps`, ok: t.data_transmission_rate.status === "NORMAL" },
      { label: "Thermal Control Status", value: t.thermal_control_status.value === 1 ? "NOMINAL" : "DEGRADED", ok: t.thermal_control_status.status === "NORMAL" },
    ];
    document.getElementById("metricCards").innerHTML = cards.map((c) => `
      <div class="metric-card glass glass-hover">
        <div class="top-line" style="background:linear-gradient(90deg,transparent,${c.ok ? "var(--primary)" : "var(--critical)"},transparent)"></div>
        <div class="label"><span>${c.label}</span></div>
        <p class="value" style="color:${c.ok ? "var(--primary)" : "var(--critical)"}">${c.value}</p>
        <p class="hint">${c.ok ? "Within envelope" : "Outside envelope"}</p>
      </div>`).join("");
  }

  function renderParamCharts(history) {
    document.getElementById("paramCharts").innerHTML = PARAMETERS.map((p, i) => `
      <section class="panel glass">
        <div class="panel-header"><h3>${p.label}</h3><span class="mono-num text-muted" style="font-size:.75rem">${p.unit}</span></div>
        <div class="param-chart-body"><canvas id="paramChart${i}"></canvas></div>
      </section>`).join("");
    Object.values(paramCharts).forEach((c) => c && c.destroy());
    paramCharts = {};
    const colorMap = { "var(--chart-1)": "#67d9f0", "var(--chart-2)": "#7f8ff5", "var(--chart-3)": "#7fe0a8", "var(--chart-4)": "#e8c368", "var(--chart-5)": "#e0685f" };
    const labels = history.map((h) => new Date(h.timestamp).toISOString().slice(11, 19));
    PARAMETERS.forEach((p, i) => {
      const color = colorMap[p.color] || "#67d9f0";
      paramCharts[p.key] = chartOrFallback("paramChart" + i, (canvas) => new Chart(canvas, {
        type: "line",
        data: { labels, datasets: [{ label: p.label, data: history.map((h) => h.telemetry[p.key]), borderColor: color, backgroundColor: color + "2e", fill: true, tension: 0.35, pointRadius: 0, borderWidth: 2 }] },
        options: {
          maintainAspectRatio: false, responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: "#8a93a8", font: { size: 10 }, maxTicksLimit: 8 } },
            y: { grid: { color: "rgba(148,163,184,0.12)" }, ticks: { color: "#8a93a8", font: { size: 10 } } },
          },
        },
      }));
    });
  }

  function getVisibleRecords(history) {
    let list = history.map((h) => ({
      time: new Date(h.timestamp).toISOString().replace("T", " ").slice(0, 19) + " UTC",
      battery_voltage: h.telemetry.battery_voltage,
      solar_panel_temperature: h.telemetry.solar_panel_temperature,
      orbital_altitude: h.telemetry.orbital_altitude,
      attitude_control_error: h.telemetry.attitude_control_error,
      data_transmission_rate: h.telemetry.data_transmission_rate,
      thermal: h.telemetry.thermal_control_status === 1 ? "NOMINAL" : "DEGRADED",
      health: h.prediction.priority,
    }));
    if (query) list = list.filter((r) => r.time.includes(query) || r.health.toLowerCase().includes(query.toLowerCase()));
    if (desc) list = list.slice().reverse();
    return list;
  }

  function renderTable(history) {
    const list = getVisibleRecords(history);
    document.getElementById("recordsSubtitle").textContent = `${list.length} samples · ${satId}`;
    document.getElementById("recordsBody").innerHTML = list.map((r) => `
      <tr class="${r.health === "CRITICAL" ? "row-critical" : ""}">
        <td class="mono-num text-muted">${r.time}</td>
        <td class="mono-num">${satId}</td>
        <td class="mono-num" style="color:${r.battery_voltage < 22.02 ? "var(--critical)" : ""}">${r.battery_voltage.toFixed(2)}</td>
        <td class="mono-num" style="color:${(r.solar_panel_temperature > 39.89 || r.solar_panel_temperature < -40.11) ? "var(--warning)" : ""}">${r.solar_panel_temperature.toFixed(1)}</td>
        <td class="mono-num">${r.orbital_altitude.toFixed(2)}</td>
        <td class="mono-num" style="color:${r.attitude_control_error > 3.99 ? "var(--critical)" : ""}">${r.attitude_control_error.toFixed(2)}</td>
        <td class="mono-num">${r.data_transmission_rate.toFixed(1)}</td>
        <td>${thermalStatusHTML(r.thermal)}</td>
        <td>${statusChipHTML(r.health)}</td>
      </tr>`).join("");
  }

  function csvCell(value) {
    const text = String(value ?? "");
    return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
  }

  function exportCsv() {
    const rows = getVisibleRecords(currentHistory);
    const headers = ["Timestamp", "Satellite", "Battery V", "Temp °C", "Altitude km", "Attitude °", "Rate Mbps", "Thermal Status", "Health"];
    const lines = [
      headers.map(csvCell).join(","),
      ...rows.map((r) => [
        r.time,
        satId,
        r.battery_voltage.toFixed(2),
        r.solar_panel_temperature.toFixed(1),
        r.orbital_altitude.toFixed(2),
        r.attitude_control_error.toFixed(2),
        r.data_transmission_rate.toFixed(1),
        r.thermal,
        r.health,
      ].map(csvCell).join(",")),
    ];
    const blob = new Blob(["\uFEFF" + lines.join("\r\n") + "\r\n"], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `${satId.toLowerCase()}-telemetry-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  async function refresh() {
    renderToggles();
    const [telemetryRes, historyRes] = await Promise.all([
      api.getSatelliteTelemetry(satId),
      api.getSatelliteHistory(satId, 100),
    ]);
    currentHistory = historyRes.history;
    renderMetricCards(telemetryRes.telemetry);
    renderParamCharts(currentHistory);
    renderTable(currentHistory);
  }

  document.getElementById("searchInput").addEventListener("input", (e) => { query = e.target.value; renderTable(currentHistory); });
  document.getElementById("sortBtn").addEventListener("click", () => { desc = !desc; document.getElementById("sortBtn").textContent = "Sort " + (desc ? "Newest" : "Oldest"); renderTable(currentHistory); });
  document.getElementById("exportCsvBtn").addEventListener("click", exportCsv);

  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
